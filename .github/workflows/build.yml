name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 존재 여부만 검증되는 값이라 더미로 충분
      DISCORD_CLIENT_ID: ci-dummy
      DISCORD_CLIENT_SECRET: ci-dummy
      DISCORD_BOT_TOKEN: ci-dummy
      NEXTAUTH_SECRET: ci-dummy
      NEXTAUTH_URL: https://wilson-game.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
