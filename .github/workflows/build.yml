name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 존재 여부만 검증되는 값이라 더미로 충분
      DISCORD_CLIENT_ID: ci-dummy
      DISCORD_CLIENT_SECRET: ci-dummy
      DISCORD_BOT_TOKEN: ci-dummy
      NEXTAUTH_SECRET: ci-dummy
      NEXTAUTH_URL: https://wilson-game.vercel.app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
